    long_description: |
      With RoomControl, teachers manage the computer room and run digital
      exams on the school's existing Windows PCs. Exam files, results and
      screen transmission stay inside the school network. No cloud account is
      needed.

      ## Teaching

      - Seating plan with live previews of all student screens
      - Share your own screen with the class
      - Help individual students via remote control
      - Block internet access or printing for single PCs or the whole room

      ## Digital exams

      In exam mode, only approved applications start. USB storage and internet
      access are blocked, and printing is controlled. Exam files are
      distributed automatically and results are collected securely. Every
      submission is confirmed with a receipt.

      ## Integration with Nubus

      - Students sign in to an exam with the user name and password of their
        domain account. RoomControl checks the sign-in via LDAPS against the
        Samba AD of the UCS domain. Exams can also use restricted guest
        accounts.
      - Teachers sign in to Windows as usual. The console does not ask for a
        second sign-in.
      - School IT decides in the app settings which groups count as teachers
        and which as administrators.
      - During installation, the app takes the LDAP server and search base from
        the domain.
      - RoomControl only reads from the directory. It creates no users or
        groups there and changes nothing.

      ## Requirements

      - The app is installed on a domain controller of the UCS domain that runs
        Samba AD.
      - For sign-in with domain accounts, the PCs are members of the UCS
        domain.
      - All PCs in the room need Windows 10 or 11 and the RoomControl client,
        including the teacher's PC. The server provides the MSI package for
        software deployment.
      - On first start, the server creates its own certificate authority. Its
        certificate is distributed to the PCs once via group policy. The app
        includes instructions.

      The [privacy policy](https://room-control.de/en/datenschutz.html#software)
      lists which data the software sends to the vendor.
    name: RoomControl
    short_description: 'Classroom management and a secure exam mode for Windows PCs in schools.'
