    tags: []
    visuals: []
  de-DE:
    name: BigBlueButton mit Univention Nubus
    short_description: Single Sign-On, Single Logout und User Lifecycle für BigBlueButton über das Nubus-Keycloak und LDAP
    long_description: |-
      BigBlueButton ist ein quelloffenes virtuelles Klassenzimmer- und
      Webkonferenzsystem mit Vorlesungsaufzeichnung, interaktivem Whiteboard,
      Breakout-Räumen, gemeinsamen Notizen und Umfragen.

      Nutzer und Räume werden von einem BigBlueButton-Frontend verwaltet. Die
      Anleitung im Univention Help Forum beschreibt, wie die beiden
      quelloffenen Frontends Greenlight v3 (das offizielle
      BigBlueButton-Frontend) und PILOS allein durch Konfiguration an
      Univention Nubus angebunden werden:

      * Single Sign-On über OpenID Connect mit dem in Nubus enthaltenen
        Keycloak
      * Single Logout: Die Abmeldung in BigBlueButton beendet auch die
        Nubus-Sitzung. Mit PILOS beendet die Abmeldung in Nubus auch die
        BigBlueButton-Sitzung (OIDC Back-Channel Logout).
      * User Lifecycle: Konten werden bei der ersten Anmeldung angelegt und
        nutzen die stabile Nubus-entryUUID. PILOS vergibt Rollen anhand der
        Nubus-Gruppenmitgliedschaften, über OIDC-Claims oder eine direkte
        Anbindung an das LDAP-Verzeichnis von Nubus.
    icon: ''
