    long_description: ' Jitsi ist eine vollständig verschlüsselte und zu 100% Open Source-Videokonferenzlösung
    für sichere Video Konferenzen. Für die Nutzung wird nur ein Webbrowser oder die Jitsi Meet App für mobile Geräte benötigt.

    Die UCS App Jitsi Meet installiert die Video Konferenz Lösung Jitsi in einer UCS-Umgebung mit allen nötigen Features,
    um Video Konferenzen durchzuführen. Die Anbindung an den UCS Verzeichnisdienst via LDAP ist bereits konfiguriert,
    so dass Administratoren einer UCS Umgebung zentral über die Univention Management Console (UMC) Nutzer*innen den
    Zugriff auf Jitsi mit ihren gewohnten Benutzernamen und Passwort geben können.
    Über das UCS Portal kann Jitsi anschließend einfach aufgerufen werden.

    Es handelt sich bei der UCS Jitsi App um eine Single Instanz Installation von Jitsi. Die Zahl der Teilnehmer
    in einer Konferenz und die Zahl der parallelen Konferenzen ist dabei durch die Kapazität des verwendeten
    Servers begrenzt. Grob geschätzt sind pro Teilnehmer 0,5 Mbit/s Bandbreite am Server erforderlich.
    Eine Maschine mit 4 CPUs und 8 GB RAM wird empfohlen. '
    name: Jitsi Meet
    short_description: 'Open Source Video Konferenz Lösung

      '
