    long_description: |
      Collabora Online is a powerful collaborative office suite that supports all major document, spreadsheet and presentation file formats, which you can integrate into your own infrastructure.

      Collabora Online provides data security and sovereignty, and is ideally suited to the demands of a modern distributed working environment.

      Delivering a familiar look and feel, Collabora Online represents a real alternative to other big-brands solutions, giving you control and flexibility.

      This app installs Collabora Online into your local UCS environment. It enables your users to edit office documents with their browser. It integrates with Nextcloud and EGroupware and requires one of these apps in your UCS environment.

      This app contains the **unrestricted full version** of Collabora Online. See ["Understanding the differences between CODE and Collabora Online"](https://www.collaboraonline.com/case-studies/differences-between-code-and-collabora-online/) for more details on the differences. The app requires a license key. Without a valid license key, all documents opened in it will display a warning text as a watermark.

      ### Key Features

      - Excellent interoperability with OOXML and ODF, plus PDF 2.0 export
      - View and edit text documents, spreadsheets, presentations & more
      - Preservation of layout and formatting of documents (WYSIWYG)
      - Collaborative editing
      - Live notifications of users entering or exiting
      - Insert, edit and reply to comments in threads
      - Track and manage changes
      - Multiple presentation options
      - Optional AI integration
      - Admin console for monitoring system utilization
      - WOPI (Web Application Open Platform Interface) protocol for communication with your web application (authentication and file transfer)
    name: Collabora Online
