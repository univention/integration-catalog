id: COMMUNITY-opendesk-edu-grommunio
description:
  en-US:
    name: Grommunio in openDesk Edu
    short_description: Email and groupware via Grommunio with Nubus SSO in openDesk Edu
    long_description: |-
      Grommunio is an email and groupware solution integrated into the openDesk
      Edu project as an alternative to OX App Suite. It provides email, calendar,
      contacts, and tasks with ActiveSync 16.1 support for native mobile
      synchronization.

      As part of openDesk Edu, Grommunio is integrated with Univention Nubus
      for Single Sign-On via OIDC/SAML through the Keycloak identity provider
      included in Nubus.
    icon: ''
    keywords:
    - Grommunio
    - Groupware
    - Email
    - Calendar
    - ActiveSync
    - openDesk Edu
    - Nubus
    links:
    - Description: openDesk Edu on Codeberg
      URL: https://codeberg.org/opendesk-edu/opendesk-edu
    - Description: Grommunio website
      URL: https://grommunio.com/
    tags: []
    visuals: []
  de-DE:
    name: Grommunio in openDesk Edu
    short_description: E-Mail und Groupware mit Grommunio und Nubus-SSO in openDesk Edu
    long_description: |-
      Grommunio ist eine E-Mail- und Groupware-Lösung, die als Alternative
      zu OX App Suite in das openDesk-Edu-Projekt integriert ist. Es bietet
      E-Mail, Kalender, Kontakte und Aufgaben mit ActiveSync-16.1-
      Unterstützung für native mobile Synchronisation.

      Als Teil von openDesk Edu ist Grommunio über OIDC/SAML mit Univention
      Nubus für Single Sign-On integriert, unter Verwendung des in Nubus
      enthaltenen Keycloak-Identity-Providers.
    icon: ''
    keywords:
