    - Description: audriga website
      URL: https://www.audriga.com
    long_description: 'With the audriga Groupware Migration Service, you can migrate
      emails, contacts, calendars, and tasks from other servers or hosting providers
      to UCS. The application installs a link to audriga''s migration platform,
      where the migration can be configured and executed.


      The source and target systems must provide the required standard protocols
      (IMAP, EWS, CardDAV, and CalDAV) over the Internet. Audriga''s service supports
      all major IMAP servers as well as standard email and groupware platforms,
      including Open-Xchange, Zimbra, Kopano, Kerio, Microsoft Exchange, Microsoft
      365, Google Workspace, Amazon WorkMail, HCL Notes, GroupWise, Stalwart, grommunio,
      IceWarp, and many others. Support for additional systems is available upon
      request.


      audriga also offers consulting for migration projects of any size. For messaging,
      online storage, and content management solutions, audriga supports the transfer
      of data types such as files and chats between different systems, including
      Sharepoint, OneDrive, Nextcloud, OpenCloud, XWiki, Confluence, MS Teams, Matrix,
      Mattermost, and Trello. Please contact audriga directly for these services.

      '
    name: audriga Groupware Migration Service
    short_description: 'Mailbox migration service

      '
