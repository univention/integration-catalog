    links:
    - Description: 'Webseite'
      URL: 'https://www.collaboraonline.com/collabora-online/'
    long_description: |
      Collabora Online ist eine leistungsstarke Office-Suite für die Zusammenarbeit, die alle wichtigen Dateiformate für Dokumente, Tabellenkalkulationen und Präsentationen unterstützt, die Sie in Ihre eigene Infrastruktur integrieren können.

      Collabora Online bietet Datensicherheit und -hoheit und ist ideal für die Anforderungen einer modernen verteilten Arbeitsumgebung geeignet.

      Mit seinem vertrauten Erscheinungsbild ist Collabora Online eine echte Alternative zu den Lösungen der großen Marken und bietet Ihnen Kontrolle und Flexibilität.

      Diese App installiert Collabora Online in Ihre lokale UCS-Umgebung. Sie ermöglicht es Ihren Nutzern, Office Dokumente mit ihrem Browser zu bearbeiten. Die App integriert sich mit Nextcloud und EGroupware und benötigt eine dieser Lösungen in Ihrer UCS-Umgebung.

      Diese App enthält die **unbeschränkte Vollversion** von Collabora Online. Siehe ["Verstehen der Unterschiede zwischen CODE und Collabora Online"](https://www.collaboraonline.com/case-studies/differences-between-code-and-collabora-online/) für weitere Details zu den Unterschieden. Die App benötigt einen Lizenzschlüssel. Ohne gültigen Lizenzschlüssel werden alle darin geöffneten Dokumente mit einem Warnhinweis als Wasserzeichen versehen.

      ### Hauptmerkmale

      - Ausgezeichnete Interoperabilität mit OOXML und ODF, sowie PDF-2.0-Export
      - Anzeigen und Bearbeiten von Textdokumenten, Tabellenkalkulationen, Präsentationen & mehr
      - Erhaltung von Layout und Formatierung in Dokumenten (WYSIWYG)
      - Kollaborative Bearbeitung
      - Live-Benachrichtigungen von Benutzern, die eintreten oder beenden
      - Einfügen, Bearbeiten und Beantworten von Kommentaren in Threads
      - Nachverfolgen und Verwalten von Änderungen
      - Mehrere Präsentationsoptionen
      - Optionale KI-Integration
      - Admin-Konsole zur Überwachung der Systemauslastung
      - WOPI (Web Application Open Platform Interface) Protokoll für die Kommunikation mit Ihrer Webanwendung (Authentifizierung und Dateiübertragung)
