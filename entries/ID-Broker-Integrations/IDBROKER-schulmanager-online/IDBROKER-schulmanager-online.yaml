  en-US:
    icon: logo.png
    keywords:
      - Education
      - School Administration
      - School Organisation
    links:
      - Description: Schulmanager Online Website
        URL: https://schulmanager-online.de/
    long_description: |
      Schulmanager Online is a comprehensive online platform for complete school
      organisation. More than 3,700 schools use the solution daily for planning,
      organising and communicating.

      ## Features (over 30 modules)

      - Absences: leave requests, absences, sick note reporting
      - Communication: parent letters, messages, video conferences
      - Appointments & bookings: calendar, exams, resources, elective courses, parent-teacher day, office hours, parent conversations
      - Information: documents, info screen, school information, notice board
      - Teaching & documentation: class register, learning, all-day care, student file, follow-up work
      - Timetable & substitution plan: timetable, timetable planning, substitution planning, overtime
      - Grades & report cards: grades, report cards, LEG, grade conference, conduct grades
      - Administrative processes: school enrolment, payments
      - Single Sign-On via OpenID Connect (e.g. with UCS@school)
      - Hosted in an ISO 27001-certified data centre in Germany
      - Modular design – individually customisable

      ## Integration with UCS@school

      Schulmanager Online is connected to UCS@school via the Univention ID Broker.
      Students and teachers can log in to Schulmanager Online with their
      UCS@school credentials using Single Sign-On.
    name: Schulmanager Online
    short_description: Online platform for school organisation with over 30 modules
    tags:
      - School Administration
      - School Organisation
