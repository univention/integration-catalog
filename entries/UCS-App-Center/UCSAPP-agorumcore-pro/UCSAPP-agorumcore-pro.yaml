    long_description: |
      **The architecture of your digital future. The foundation for productive AI.**

      agorum core pro is the business platform for document management (DMS),
      centralized data storage, and business process digitization. All processes in
      your organization can be configured quickly and easily. Whether you're a small
      business or a large enterprise: agorum core pro helps organizations of any size
      manage all their documents, emails, and records digitally, in a structured and
      secure way. Thanks to its open architecture, the solution adapts precisely to
      your requirements - flexible, always up to date, and built to protect your
      investment.

      With agorum core pro, you digitize paper-based processes, establish centralized
      information management, and automate a wide range of workflows. The result: a
      single platform where all relevant business data is managed in one place -
      compliant, audit-proof, and secure.

      Organizations that eliminate information silos and build clean data structures
      lay the foundation for what comes next: agorum core pro is the ideal basis for
      your own AI business platform with a built-in knowledge base. ALBERT | AI
      exclusively accesses validated, current, and authorized information.

      ## Feature overview

      The key functions for digitization and document management include:

      - Document management: securely store, structure, version, tag, and legally
        compliant archive files and emails of any type.
      - Search and discovery: fast full-text search, filters, search templates, and
        metadata search across all content.
      - Automated workflows: routine tasks - such as invoice verification, approvals,
        or contract management - run fully automatically based on defined rules or
        using AI.
      - E-files and case management: clear, user-friendly digital files organized in
        custom structures.
      - Integration and interfaces: connect existing IT systems to exchange and
        synchronize data automatically.
      - DMS Drive (network drive): work with documents directly from familiar
        applications (e.g. Word, Excel) as if they were on a classic network drive.
      - Mobile access: access documents and tasks on the go via web browser (Mobile
        mode).
      - Metadata management: add as many custom metadata fields per document as
        needed to power processes, workflows, and search.
      - AI platform: with add-on plugins, integrate ALBERT | AI Chat into agorum core
        pro - or expand agorum core pro into your own AI platform.

      ## agorum core pro integrated with UCS

      Thanks to its availability in the Univention App Center, agorum core pro
      installs and is ready to use in just a few clicks. By connecting to UCS
      Identity Management, users and groups can be synchronized directly.
      Integration via Kerberos for authentication is also possible.

      ## Licensing

      A valid license is required for production use of agorum core pro and its
      add-on modules. Not sure how agorum core pro fits your organization? Get in
      touch: https://www.agorum.com/ueber-uns/kontakt
