id: COMMUNITY-opendesk-openproject
description:
  en-US:
    name: OpenProject in openDesk
    short_description: Project management via OpenProject with Nubus SSO in the openDesk suite
    long_description: |-
      OpenProject is the project management component of the openDesk digital
      workplace suite. It provides work packages, Gantt charts, agile boards,
      time tracking, and project planning features.

      As part of openDesk, OpenProject is integrated with Univention Nubus for
      Single Sign-On via OIDC through the Keycloak identity provider
      included in Nubus. It uses the Nubus Directory Service to implement
      user and group lifecycle.
    icon: 'logo.png'
    keywords:
    - OpenProject
    - Project Management
    - Gantt
    - Agile
    - openDesk
    - Nubus
    links:
    - Description: openDesk on openCoDE
      URL: https://gitlab.opencode.de/bmi/opendesk/deployment/opendesk
    - Description: OpenProject website
      URL: https://www.openproject.org/
    tags: []
    visuals: []
  de-DE:
    name: OpenProject in openDesk
    short_description: Projektmanagement mit OpenProject und Nubus-SSO in der openDesk-Suite
    long_description: |-
      OpenProject ist die Projektmanagement-Komponente der digitalen
      Arbeitsplatzlösung openDesk. Es bietet Arbeitspakete, Gantt-Diagramme,
      Agile-Boards, Zeiterfassung und Projektplanungsfunktionen.

      Als Teil von openDesk ist OpenProject über OIDC mit Univention
      Nubus für Single Sign-On integriert, unter Verwendung des in Nubus
      enthaltenen Keycloak-Identity-Providers. Es greift auf den Nubus Directory
      Service zu um Nutzer und Gruppen abzugleichen.
    icon: 'logo.png'
    keywords:
    - OpenProject
    - Projektmanagement
    - Gantt
    - Agile
    - openDesk
    - Nubus
    links:
    - Description: openDesk auf openCoDE
      URL: https://gitlab.opencode.de/bmi/opendesk/deployment/opendesk
    - Description: OpenProject-Webseite
      URL: https://www.openproject.org/
    tags: []
    visuals: []
