id: NC-PI
description:
  en-US:
    name: Nextcloud Packaged Integration
    short_description: |-
      Packaged Integration and Documentation to connect a Nextcloud
      installation with Nubus for User- and Group Management and SSO
    long_description: |-
      Preconfiguration of Nubus to connect Nextcloud to retrieve
      users and groups from Nubus. Adds additional attributes to Nubus to
      be able to decide which users and groups are available
      in Nextcloud and which quota a user has.
      Documentation also covers links to Single Sign-On Setup.
    icon: path/to/icon
    keywords: []
    links:
    - Description: Nextcloud Packaged Integration
      URL: https://docs.software-univention.de/packaged-integration-nextcloud/latest/en/index.html
    - Description: Nextcloud Homepage
      URL: https://www.nextcloud.com
    - Description: Nextcloud Source Code
      URL: https://github.com/nextcloud
    tags:
    - Filestore
    - Groupware
    visuals:
    - path/to/visual1
    - path/to/visual2
  de-DE:
    name: Nextcloud Packaged Integration
    short_description: Vorkonfiguration von Nubus zur Integration mit Nextcloud
    long_description: "Vollständige Vorkonfiguration von Nubus zur Integration\nmit Nextcloud:\n  - Attribute zur Definition,\
      \ welche Nutzer und Gruppen in Nextcloud bekannt sein sollen\n  - Definition von Quota eines Users in Nextcloud    \
      \    \n  - Dokumentation der Einrichtung von Nextcloud"
    icon: ''
    keywords: []
