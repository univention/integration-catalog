id: COMMUNITY-opendesk-edu-zammad
description:
  en-US:
    name: Zammad in openDesk Edu
    short_description: Service desk via Zammad with Nubus SSO in openDesk Edu
    long_description: |-
      Zammad is a helpdesk and ticketing system integrated into the openDesk
      Edu project. It provides multi-channel support via email, chat, and phone,
      with a modern web interface for IT support teams at universities and
      educational institutions.

      As part of openDesk Edu, Zammad is integrated with Univention Nubus for
      Single Sign-On via SAML through the Keycloak identity provider included
      in Nubus.
    icon: 'logo.svg'
    keywords:
    - Zammad
    - Helpdesk
    - Ticketing
    - Service Desk
    - IT Support
    - openDesk Edu
    - Nubus
    links:
