    links:
    - Description: audriga Website
      URL: https://www.audriga.com
    long_description: 'Mit dem audriga Groupware Migrationsservice können Sie E-Mails,
      Kontakte, Kalendereinträge und Aufgaben von anderen Servern oder Hosting-Angeboten
      zu UCS umziehen. Die Anwendung installiert einen Link zur Migrationsanwendung
      von audriga, auf der die Migration konfiguriert und durchgeführt wird. Die
      involvierten Server müssen die benötigten Standardprotokolle (IMAP, EWS, CardDAV,
      CalDAV) über das Internet bereitstellen. Der Dienst unterstützt alle gängigen
      IMAP Server sowie Standard-E-Mail- und Groupware-Plattformen wie Open-Xchange,
      Zimbra, Kopano, Kerio, Exchange, MS 365, Google, Amazon Workmail, HCL Notes,
      GroupWise, Stalwart, grommunio, IceWarp. etc. Weitere Systeme können angefragt
      werden.


      audriga bietet ebenso Consulting zu Migrationsprojekten jeglicher Größenordnung
      an. Im Bereich Messaging-, Online-Speicher- und Content-Management-Lösungen
      unterstützt audriga den Transfer von Datentypen wie z.B. Dateien und Chats
      zwischen unterschiedlichen Systemen wie Sharepoint, OneDrive, Nextcloud, OpenCloud,
      XWiki, Confluence, MS Teams, Matrix, Mattermost, Trello etc. Bitte kontaktieren
      Sie audriga hierfür direkt.

      '
    name: audriga Groupware Migration Service
    short_description: 'Service zur einfachen Migration von E-Mail Konten

      '
