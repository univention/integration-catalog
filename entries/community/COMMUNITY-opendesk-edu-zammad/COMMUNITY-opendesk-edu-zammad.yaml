      URL: https://codeberg.org/opendesk-edu/opendesk-edu
    - Description: Zammad website
      URL: https://zammad.com/
    tags: []
    visuals: []
  de-DE:
    name: Zammad in openDesk Edu
    short_description: Service-Desk mit Zammad und Nubus-SSO in openDesk Edu
    long_description: |-
      Zammad ist ein Helpdesk- und Ticketsystem, das in die
      openDesk-Edu-Projekt integriert ist. Es bietet Mehrkanalunterstützung
      über E-Mail, Chat und Telefon mit einer modernen Weboberfläche für
      IT-Support-Teams an Universitäten und Bildungseinrichtungen.

      Als Teil von openDesk Edu ist Zammad über SAML mit Univention Nubus
      für Single Sign-On integriert, unter Verwendung des in Nubus
      enthaltenen Keycloak-Identity-Providers.
    icon: 'logo.svg'
    keywords:
