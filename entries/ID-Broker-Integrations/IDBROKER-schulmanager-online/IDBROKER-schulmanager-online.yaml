id: IDBROKER-schulmanager-online
description:
  de-DE:
    icon: logo.png
    keywords:
      - Education
      - Schulverwaltung
      - Schulorganisation
    links:
      - Description: Schulmanager Online Website
        URL: https://schulmanager-online.de/
    long_description: |
      Schulmanager Online ist eine umfassende Online-Plattform für die gesamte
      Schulorganisation. Über 3.700 Schulen nutzen die Lösung täglich für
      Planung, Organisation und Kommunikation.

      ## Funktionen (über 30 Module)

      - Absenzen: Beurlaubung, Fehlzeiten, Krankmeldung
      - Kommunikation: Elternbriefe, Nachrichten, Videokonferenzen
      - Termine & Buchungen: Kalender, Klassenarbeiten, Ressourcen, Wahlfächer, Elternsprechtag, Sprechstunden, Elterngespräche
      - Informationen: Dokumente, Infoscreen, Schulinformationen, Schwarzes Brett
      - Unterricht & Dokumentation: Klassenbuch, Lernen, Ganztag, Schülerakte, Nacharbeit
      - Stunden- & Vertretungsplan: Stundenplan, Stundenplanung, Vertretungsplanung, Mehrarbeit
      - Noten & Zeugnisse: Noten, Zeugnisse, LEG, Zeugniskonferenz, Kopfnoten
      - Verwaltungsabläufe: Schulanmeldung, Zahlungen
      - Single Sign-On über OpenID Connect (z. B. mit UCS@school)
      - Läuft in einem ISO 27001-zertifizierten Rechenzentrum in Deutschland
      - Modularer Aufbau – individuell zusammenstellbar

      ## Integration mit UCS@school

      Schulmanager Online ist über den Univention ID Broker an UCS@school
      angebunden. Schüler*innen und Lehrkräfte können sich mit ihrem
      UCS@school-Benutzerkonto per Single Sign-On bei Schulmanager Online
      anmelden.
    name: Schulmanager Online
    short_description: Online-Plattform für Schulorganisation mit über 30 Modulen
    tags:
      - Schulverwaltung
