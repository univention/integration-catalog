id: COMMUNITY-opendesk-edu-bigbluebutton
description:
  en-US:
    name: BigBlueButton in openDesk Edu
    short_description: Virtual classroom via BigBlueButton with Nubus SSO in openDesk Edu
    long_description: |-
      BigBlueButton is a virtual classroom and web conferencing system
      integrated into the openDesk Edu project as an alternative to Jitsi. It
      provides lecture recording, interactive whiteboard, breakout rooms,
      shared notes, and polling features designed for online teaching.

      As part of openDesk Edu, BigBlueButton is integrated with Univention
      Nubus for Single Sign-On via SAML through the Keycloak identity provider
      included in Nubus.
    icon: ''
