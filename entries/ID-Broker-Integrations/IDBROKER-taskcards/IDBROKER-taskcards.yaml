    long_description: |
      TaskCards is a GDPR-compliant digital platform for creating, organizing and
      collaborating on digital content in education, projects and other shared
      workflows. The browser-based application makes it easy to structure, jointly
      edit and present digital content – regardless of the device used.

      TaskCards is used especially in education and supports teaching and learning
      processes as well as organization and communication within educational
      institutions. Beyond classroom use, the platform offers a wide range of options
      for school organization, working groups and steering committees, events, parent
      engagement and other forms of collaboration.

      The flexible model for permissions and sharing makes it easy to involve learners,
      parents, external partners or project participants in workflows. TaskCards is
      also suitable for teams, projects and organizations outside the education
      sector.

      ## Features

      - Digital pinboards for collecting, structuring and presenting information, materials and results.
      - Different presentation formats, including Board, Chalkboard, Timeline, Worldmap and Blog.
      - Support for a wide range of content, including text, images, videos, audio, documents and links.
      - Collaborative creation, editing and sharing of content for teaching, projects and working groups.
      - Flexible design options and a comprehensive permissions and access model for different use cases.
      - Options for feedback, communication and interaction.
      - Browser-based access across devices with a GDPR-compliant, data-minimizing design.

      ## Integration with UCS@school

      TaskCards is connected to UCS@school through the Univention ID Broker. Users
      can sign in to TaskCards with their UCS@school account via Single Sign-On.
