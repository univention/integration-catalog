    - Description: How-To on Univention Help Forum
      URL: https://help.univention.com/t/TODO-how-to-jupyterhub-with-univention-nubus
    - Description: OAuthenticator – Generic OAuth
      URL: https://oauthenticator.readthedocs.io/en/latest/tutorials/provider-specific-setup/providers/generic.html
    - Description: JupyterHub website
      URL: https://jupyter.org/hub
    tags: []
    visuals: []
  de-DE:
    name: JupyterHub mit Univention Nubus
    short_description: Single Sign-On, Logout und gruppenbasierter Zugriff für JupyterHub (mit JupyterLab und RStudio) über das Nubus-Keycloak
    long_description: |-
      JupyterHub ist der quelloffene Mehrbenutzer-Server für Jupyter-Notebooks,
      der in Forschung und Lehre für interaktives Rechnen mit Python, R, Julia
      und weiteren Sprachen eingesetzt wird.

      Die Anleitung im Univention Help Forum beschreibt, wie JupyterHub allein
      durch Konfiguration an Univention Nubus angebunden wird:

      * Single Sign-On über OpenID Connect mit dem in Nubus enthaltenen
        Keycloak, auch für JupyterLab und ein RStudio-Profil der Benutzer
      * Logout: Die Abmeldung in JupyterHub beendet auch die Nubus-Sitzung.
      * Zugriff und Rollen aus Nubus: Nur Mitglieder einer Nubus-Gruppe können
        sich anmelden, Mitglieder einer Admin-Gruppe werden
        JupyterHub-Administratoren, und Nubus-Gruppen werden als
        JupyterHub-Gruppen gespiegelt. Eine regelmäßige Token-Aktualisierung
        hindert deaktivierte Nubus-Benutzer daran, Server zu starten.
    icon: 'logo.svg'
