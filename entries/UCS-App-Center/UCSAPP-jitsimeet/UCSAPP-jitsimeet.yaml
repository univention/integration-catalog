      URL: ''
    long_description: 'Jitsi is a fully encrypted and 100% open source video conferencing solution for
    secure video conferencing. All you need is a web browser or the Jitsi Meet app for mobile devices.

    The UCS app Jitsi Meet installs the video conferencing solution Jitsi in a UCS environment with all
    the features necessary to conduct video conferences. The connection to the UCS directory service via
    LDAP is already configured, so that administrators of a UCS environment can give users access to Jitsi
    centrally via the Univention Management Console (UMC) with their usual user name and password. Jitsi
    can then be easily accessed via the UCS portal.

    The UCS Jitsi App is a single instance installation of Jitsi. The number of participants in a conference
    and the number of parallel conferences is limited by the capacity of the server used. A rough estimate
    is that 0.5 Mbit/s bandwidth per participant is required on the server. A machine with 4 CPUs and 8 GB
    RAM is recommended. '
    name: Jitsi Meet
    short_description: 'Open Source Video Conferencing Solution

      '
