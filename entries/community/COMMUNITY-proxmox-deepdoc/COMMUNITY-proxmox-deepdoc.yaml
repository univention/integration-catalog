id: COMMUNITY-proxmox-deepdoc
description:
  en-US:
    name: Proxmox integration with Univention Nubus via OpenID Connect
    short_description: Community how-to for connecting Proxmox to Univention Nubus via OIDC
    long_description: |-
      Community documentation for connecting Proxmox to Univention Nubus via
      OpenID Connect (OIDC), including control of login permissions through
      LDAP groups.

      The guide describes a working OIDC client configuration for Proxmox using
      the Keycloak service integrated in Nubus. It can serve as a template for
      connecting other applications to Nubus.
    icon: ''
    keywords:
    - Proxmox
    - Nubus
    - OpenID Connect
    - Virtualisation
    - Keycloak
    links:
    - Description: How-To (deepdoc.at)
      URL: https://deepdoc.at/dokuwiki/doku.php?id=virtualisierung:proxmox_kvm_und_lxc:openid_keycloak_anbindung_proxmox
    tags: []
    visuals: []
  de-DE:
    name: Proxmox Anbindung an Univention Nubus über OpenID Connect
    short_description: Community-Anleitung zur OIDC-Integration von Proxmox mit Univention Nubus
    long_description: |-
      Community-Dokumentation zur Anbindung von Proxmox an Univention Nubus über
      OpenID Connect (OIDC), einschließlich der Steuerung von Login-Berechtigungen
      über LDAP-Gruppen.

      Die Anleitung beschreibt eine funktionierende OIDC-Client-Konfiguration für
      Proxmox unter Verwendung des in Nubus integrierten Keycloak-Dienstes. Sie
      kann als Vorlage für die Anbindung weiterer Anwendungen dienen.
    icon: ''
    keywords:
    - Proxmox
    - Nubus
    - OpenID Connect
    - Virtualisierung
    - Keycloak
    links:
    - Description: How-To (deepdoc.at)
      URL: https://deepdoc.at/dokuwiki/doku.php?id=virtualisierung:proxmox_kvm_und_lxc:openid_keycloak_anbindung_proxmox
