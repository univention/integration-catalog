    long_description: |
      ONLYOFFICE Docs Enterprise is a powerful online office suite designed for organizations and larger teams that require secure collaboration, advanced editing capabilities, and full control over their data. The solution offers enterprise-grade security, scalability, professional technical support, and excellent compatibility with Microsoft Office formats (OOXML) and PDF files.

      The suite includes diagram viewer and collaborative editors for:

      - Text documents
      - Spreadsheets
      - Presentations
      - Fillable forms
      - PDFs

      ## Key features

      ### Comprehensive editing tools for text documents, sheets, and presentations

      - Intuitive tabbed interface similar to desktop office applications
      - Extensive formatting and editing capabilities
      - Support for footnotes, tables of contents, bookmarks, and document navigation
      - More than 450 formulas and functions, flexible data analysis, and visualization tools
      - Professional presentation tools, including Presenter View, Speaker notes, and Slides

      ### Easy PDF editing

      - File editing and co-editing
      - Fillable PDF form creation
      - Redact feature
      - Annotations, drawings, and comments
      - Stamps, signatures

      ### Real-time collaboration

      - Real-time and paragraph-locking co-editing modes
      - Comments and built-in chat
      - Version history
      - Track Changes
      - Flexible access permissions

      ### AI features (optional)

      - Content generation and analysis
      - Natural language commands for text formatting
      - AI chatbot in the editors
      - Personalized assistant
      - Macro creation and conversion
      - AI provider of your choice, including open source or local ones

      ### Extended functionality

      - Mobile web editors
      - Live viewer
      - Third-party plugins for image editing, video embedding, translation, and more

      ### Enterprise-grade security

      - GDPR compliance and open source code
      - HTTPS and JWT support
      - End-to-end encryption
      - Flexible user access restrictions, document permission management, signatures

      ### Administration and management

      The built-in Admin Panel provides centralized management of editors, integrations, licenses, and security settings, along with monitoring, user provisioning via LDAP and SSO, and tools for automation and scalable deployments.

      ## File format compatibility

      ONLYOFFICE provides broad compatibility with popular document formats, including:

      - **Documents:** DOCX, DOC, DOCM, DOTX, DjVu, EPUB, FB2, HTML, ODT, OTT, PDF, PDF/A, RTF, TXT, MD, XML, XPS, HWP, HWPX, Pages
      - **Spreadsheets:** XLSX, XLS, XLTX, OTS, ODS, CSV, Numbers
      - **Presentations:** PPTX, PPT, PPSX, POTX, OTP, ODP, Keynote
      - **PDFs:** PDF, PDF/A, PDF forms

      ## About this edition

      ONLYOFFICE Docs Enterprise is recommended for organizations with more than 20 users and requires professional technical support and regular updates.

      The solution integrates with file sharing platforms such as:

      - Nextcloud
      - ownCloud
      - Seafile
      - Odoo
      - Confluence
      - Drupal
      - HumHub

      Your documents remain stored in your chosen file storage platform, ONLYOFFICE does not store user document data.

      Important: Before installing ONLYOFFICE Docs Enterprise, uninstall ONLYOFFICE Docs Community. Your existing documents will remain in your storage platform and can be accessed after the upgrade.
