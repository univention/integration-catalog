      URL: https://help.univention.com/t/TODO-how-to-jupyterhub-with-univention-nubus
    - Description: jupyter-rsession-proxy
      URL: https://github.com/jupyterhub/jupyter-rsession-proxy
    - Description: Rocker-Projekt (R-Container-Images)
      URL: https://rocker-project.org/
