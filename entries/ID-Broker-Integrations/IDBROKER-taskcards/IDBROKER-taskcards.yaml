    long_description: |
      TaskCards ist eine DSGVO-konforme digitale Plattform für die Erstellung,
      Organisation und Zusammenarbeit an digitalen Inhalten in Bildung, Projekten
      und kollaborativen Arbeitsprozessen. Die browserbasierte Anwendung ermöglicht
      die einfache Strukturierung, gemeinsame Bearbeitung und Präsentation digitaler
      Inhalte – unabhängig vom verwendeten Endgerät.

      TaskCards wird insbesondere im Bildungsbereich eingesetzt und unterstützt
      Lehr- und Lernprozesse ebenso wie die Organisation und Kommunikation innerhalb
      von Bildungseinrichtungen. Neben dem Einsatz im Unterricht bietet die Plattform
      vielfältige Möglichkeiten für Schulorganisation, Arbeits- und Steuergruppen,
      Veranstaltungen, Elternarbeit sowie weitere Formen der Zusammenarbeit.

      Durch das flexible Berechtigungs- und Freigabekonzept können Lernende, Eltern,
      externe Partner oder Projektbeteiligte einfach in Arbeitsprozesse eingebunden
      werden. Darüber hinaus eignet sich TaskCards für Teams, Projekte und
      Organisationen außerhalb des Bildungsbereichs.

      ## Funktionen

      - Digitale Pinnwände zur Sammlung, Strukturierung und Präsentation von Informationen, Materialien und Ergebnissen.
      - Verschiedene Darstellungsformen wie Pinnwand, Tafel, Zeitstrahl, Weltkarte und Blog.
      - Einbindung vielfältiger Inhalte wie Texte, Bilder, Videos, Audios, Dokumente und Links.
      - Gemeinsames Erstellen, Bearbeiten und Teilen von Inhalten für Unterricht, Projekte und Arbeitsgruppen.
      - Flexible Gestaltungsmöglichkeiten und ein umfangreiches Berechtigungs- und Zugriffskonzept für unterschiedliche Einsatzszenarien.
      - Möglichkeiten für Feedback, Austausch und Interaktion.
      - Browserbasierte, geräteunabhängige Nutzung mit DSGVO-konformer und datensparsamer Umsetzung.

      ## Integration mit UCS@school

      TaskCards ist über den Univention ID Broker an UCS@school angebunden.
      Nutzerinnen und Nutzer können sich mit ihrem UCS@school-Benutzerkonto per
      Single Sign-On bei TaskCards anmelden.
