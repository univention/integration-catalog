  de-DE:
    name: innovaphone myApps Integration mit Nubus über LDAP und Keycloak SSO
    short_description: Benutzerbereitstellung und Single Sign-On für innovaphone myApps mit Univention Nubus
    long_description: |
      Diese Integration verbindet die innovaphone myApps Platform und Telefonie-Lösung mit
      Univention Nubus über LDAP-Replikation und Single Sign-On (SSO) über Keycloak.

      In Nubus verwaltete Benutzerkonten werden über einen LDAP-Replikator
      in die innovaphone-Umgebung synchronisiert. Attribute wie
      Benutzername, Anzeigename und Telefonnummer (Durchwahl) werden aus
      dem Nubus-LDAP-Verzeichnis auf die entsprechenden
      innovaphone-Benutzerattribute abgebildet, was eine automatisierte
      Bereitstellung von Telefonie-Benutzern ermöglicht.

      Zusätzlich wird Keycloak — als Identity Provider in
      Univention Nubus enthalten — für SSO über OIDC konfiguriert.
      Benutzer authentifizieren sich einmalig über Keycloak und erhalten
      nahtlosen Zugang zur innovaphone-Plattform und ihren
      Telefonie-Funktionen.

      ## Funktionen

      - Automatische Benutzerbereitstellung von Nubus nach innovaphone über LDAP-Replikation
      - Zuordnung von LDAP-Attributen (Benutzername, Telefonnummer, Anzeigename)
      - Single Sign-On über Keycloak (OIDC)
      - Telefonie-Dienste über SSO erreichbar

