# List of capabilities an integration can provide. Used in the integration entries to describe the scope of the integration.

metadata:
  schema_version: "0.1.0"
  last_updated: "2026-02-13" # must be updated after each change, see https://yaml.org/type/timestamp.html for format

# capabilitiy definitions
capabilities:
  - id: inbound
    en-US:
      name: Inbound Data
      description: Data transfer (for example user information) from a source system to Univention Nubus or Nubus based products.
    de-DE:
      name: Datenimport
      description: Datenübertragung (z.B. Nutzerinformationen) aus einem Quellsystem zu Univention Nubus oder einem auf Nubus basierenden Produkt.
  - id: outbound
    en-US:
      name: Inbound Data
      description: Data transfer (for example user information) from Univention Nubus or Nubus based products to an application.
    de-DE:
      name: Datenimport
      description: Datenübertragung (z.B. Nutzerinformationen) von Univention Nubus oder einem auf Nubus basierenden Produkt zu einer Anwendung.
  - id: user_lifecycle
    en-US:
      name: User Lifecycle
      description: Supports transfer of user information.
    de-DE:
      name: User Lifecycle
      description: Unterstützung die Übertragung von Nutzerinformationen.
  - id: group_lifecycle
    en-US:
      name: Group Lifecycle
      description: Supports transfer of groups and group memberships.
    de-DE:
      name: Group Lifecycle
      description: Unterstützung die Übertragung von Gruppen und Gruppenmitgliedschaften.
  - id: slo
    en-US:
      name: Single Logout
      description: Support Single Logout to end user session if logged out of integrated application.
    de-DE:
      name: Single Logout
      description: Unterstützt Single Logout um die Anwendersitzung beim Ausloggen aus der angebundenen Anwendung zu beenden.
  - id: sso
    en-US:
      name: Single Sign-On
      description: Support Single Sign-On for seamless Authentication in the integrated application.
    de-DE:
      name: Single Sign-On
      description: Unterstützt Single Sign-On für nahtlose Authentifikation in der angebundenen Anwendung.
  - id: susp
    en-US:
      name: Same User Same Password
      description: Supports Authentication in the integrated application with username and password defined in Nubus.
    de-DE:
      name: Same User Same Password
      description: Unterstützt die Authentifikation an der integrierten Anwendung mit den in Nubus definierten Nutzernamen und Passwort.

