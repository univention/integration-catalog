id: COMMUNITY-help-univention-de-jupyterhub
description:
  en-US:
    name: JupyterHub with Univention Nubus
    short_description: Single Sign-On, logout and group-based access for JupyterHub (with JupyterLab and RStudio) via the Nubus Keycloak
    long_description: |-
      JupyterHub is the open source multi-user server for Jupyter notebooks,
      used in research and teaching for interactive computing with Python, R,
      Julia and other languages.

      The how-to on the Univention Help Forum describes how to connect
      JupyterHub to Univention Nubus, using configuration only:

      * Single Sign-On via OpenID Connect with the Keycloak included in Nubus,
        covering the users' JupyterLab and an RStudio profile
      * Logout: signing out of JupyterHub also ends the Nubus session.
      * Access and roles from Nubus: only members of a Nubus group can sign
        in, members of an admin group become JupyterHub administrators, and
        Nubus groups are mirrored as JupyterHub groups. A regular token
        refresh stops disabled Nubus users from starting servers.
    icon: 'logo.svg'
    keywords:
    - JupyterHub
    - Jupyter
    - JupyterLab
    - Notebooks
    - RStudio
    - Data Science
    - Nubus
    - OpenID Connect
    links:
