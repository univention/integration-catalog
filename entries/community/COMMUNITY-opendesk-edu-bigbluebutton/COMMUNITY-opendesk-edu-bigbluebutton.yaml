id: COMMUNITY-opendesk-edu-bigbluebutton
description:
  en-US:
    name: BigBlueButton with Univention Nubus
    short_description: Single Sign-On, Single Logout and user lifecycle for BigBlueButton via the Nubus Keycloak and LDAP
    long_description: |-
      BigBlueButton is an open source virtual classroom and web conferencing
      system with lecture recording, interactive whiteboard, breakout rooms,
      shared notes and polling.

      Users and rooms are managed by a BigBlueButton frontend. The how-to on
      the Univention Help Forum describes how to connect the two open source
      frontends Greenlight v3 (the official BigBlueButton frontend) and PILOS
      to Univention Nubus, using configuration only:

      * Single Sign-On via OpenID Connect with the Keycloak included in Nubus
      * Single Logout: signing out of BigBlueButton also ends the Nubus
        session. With PILOS, signing out of Nubus also ends the BigBlueButton
        session (OIDC back-channel logout).
      * User lifecycle: accounts are created at first login and use the
        stable Nubus entryUUID. PILOS assigns roles from Nubus group
        memberships, via OIDC claims or a direct connection to the Nubus
        LDAP directory.
    icon: ''
    keywords:
    - BigBlueButton
    - BBB
    - Greenlight
    - PILOS
    - Virtual Classroom
    - Video Conferencing
    - E-Learning
    - Nubus
    - OpenID Connect
    - LDAP
    links:
