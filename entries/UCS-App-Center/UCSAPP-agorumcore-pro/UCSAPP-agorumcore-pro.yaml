    long_description: |
      **Die Architektur Ihrer digitalen Zukunft. Das Fundament für produktive KI.**

      agorum core pro ist die Business-Plattform für Dokumentenmanagement (DMS),
      zentrale Datenhaltung und Geschäftsprozessdigitalisierung. Alle Prozesse in
      Ihrem Unternehmen lassen sich damit einfach und schnell konfigurieren. Ob
      kleines Unternehmen oder Konzern: agorum core pro unterstützt Organisationen
      jeder Größe dabei, sämtliche Dokumente, E-Mails und Akten digital,
      strukturiert und sicher zu verwalten. Dank offener Architektur passt sich die
      Lösung exakt an Ihre Anforderungen an: flexibel, updatefähig und
      investitionssicher.

      Mit agorum core pro digitalisieren Sie papierbasierte Prozesse, schaffen ein
      zentrales Informationsmanagement und automatisieren zahlreiche Abläufe. Das
      Ergebnis: eine Plattform, auf der alle relevanten Geschäftsdaten
      datenschutzkonform und revisionssicher an einem Ort verwaltet werden.

      Wer Informationssilos eliminiert und saubere Datenstrukturen schafft, legt das
      Fundament für den nächsten Schritt: agorum core pro ist damit die ideale
      Grundlage für Ihre eigene KI-Business-Plattform mit Wissensdatenbank. ALBERT |
      AI greift nur auf validierte, aktuelle und berechtigte Informationen zu.

      ## Funktionsübersicht

      Die wichtigsten Funktionen von agorum core pro für die Digitalisierung und
      Dokumentenverwaltung sind:

      - Dokumentenmanagement: Dateien und E-Mails jeder Art sicher, strukturiert und
        versioniert ablegen, verschlagworten und rechtskonform archivieren.
      - Suche & Recherche: Schnelle Volltextsuche, Filter, Suchvorlagen und
        Metadatensuche über alle im System befindlichen Inhalte.
      - Automatisierte Workflows: Routineaufgaben wie Rechnungsprüfung, Freigaben
        oder Vertragsmanagement laufen nach definierten Regeln oder mittels KI
        vollautomatisch ab.
      - E-Akten & Vorgangsverwaltung: Digitale Akten sind übersichtlich,
        nutzergerecht und in individuelle Strukturen gegliedert.
      - Integration & Schnittstellen: Bestehende IT-Systeme werden angebunden.
        Daten können automatisch ausgetauscht und synchronisiert werden.
      - DMS-Drive (Netzlaufwerk): Dokumente direkt von gewohnten
        Arbeitsprogrammen (z. B. Word, Excel) mit dem Server austauschen - wie mit
        einem klassischen Netzlaufwerk.
      - Mobile Nutzung: Zugriff auf Dokumente und Aufgaben unterwegs über
        Webbrowser (Mobile-Mode).
      - Metadatenmanagement: Beliebig viele individuelle Zusatzinformationen pro
        Dokument - zur Steuerung von Prozessen, Workflows und Suchen.
      - KI-Plattform: Über Zusatz-Plugins kann unser ALBERT | AI Chat in agorum
        core pro integriert und agorum core pro sogar zu Ihrer eigenen
        KI-Plattform ausgebaut werden.

      ## agorum core pro integriert in UCS

      Durch die Integration von agorum core pro in das Univention App Center ist
      agorum core pro mit wenigen Klicks installiert und einsatzbereit. Durch die
      Anbindung an das Identity Management von UCS können Benutzer und Gruppen
      direkt synchronisiert werden. Zudem ist eine Integration über Kerberos für
      die Authentisierung möglich.

      ## Lizenzierung

      Zur produktiven Nutzung von agorum core pro und den jeweiligen
      Zusatzmodulen benötigen Sie eine gültige Lizenz. Sie sind sich noch nicht
      sicher, wie agorum core pro in Ihr Unternehmen passt? Dann nehmen Sie gerne
      Kontakt zu uns auf: https://www.agorum.com/ueber-uns/kontakt
