    long_description: |
      Mit RoomControl steuern Lehrkräfte den Computerraum und führen digitale
      Prüfungen auf den vorhandenen Windows-PCs der Schule durch.
      Prüfungsdateien, Ergebnisse und die Bildschirmübertragung bleiben im
      Schulnetz. Ein Cloud-Konto ist nicht nötig.

      ## Unterricht

      - Sitzplan mit Live-Vorschau aller Schüler-Bildschirme
      - Den eigenen Bildschirm an die Klasse übertragen
      - Einzelnen Schülerinnen und Schülern per Fernsteuerung helfen
      - Internet und Drucker für einzelne PCs oder den ganzen Raum sperren

      ## Digitale Prüfungen

      Im Prüfungsmodus starten nur freigegebene Programme. USB-Speicher und
      Internet sind gesperrt, das Drucken wird kontrolliert. Aufgaben werden
      automatisch ausgeteilt und Ergebnisse sicher eingesammelt. Jede Abgabe
      wird mit einer Quittung bestätigt.

      ## Anbindung an Nubus

      - Schülerinnen und Schüler melden sich zur Prüfung mit Benutzername und
        Passwort ihres Domänenkontos an. RoomControl prüft die Anmeldung per
        LDAPS am Samba AD der UCS-Domäne. Prüfungen sind auch mit abgesicherten
        Gastkonten möglich.
      - Lehrkräfte melden sich wie gewohnt an Windows an. Eine zweite Anmeldung
        an der Konsole ist nicht nötig.
      - Welche Gruppen als Lehrkräfte und welche als Administratoren gelten,
        legt die Schul-IT in den App-Einstellungen fest.
      - LDAP-Server und Suchbasis übernimmt die App bei der Installation aus der
        Domäne.
      - RoomControl liest nur aus dem Verzeichnis. Es legt dort keine Benutzer
        oder Gruppen an und ändert nichts.

      ## Voraussetzungen

      - Die App wird auf einem Domänencontroller der UCS-Domäne installiert, auf
        dem Samba AD läuft.
      - Für die Anmeldung mit Domänenkonten sind die PCs Mitglied der
        UCS-Domäne.
      - Alle PCs im Raum brauchen Windows 10 oder 11 und den
        RoomControl-Client, auch der PC der Lehrkraft. Das MSI-Paket für die
        Softwareverteilung liefert der Server selbst aus.
      - Der Server erzeugt beim ersten Start eine eigene Zertifizierungsstelle.
        Ihr Zertifikat wird einmal per Gruppenrichtlinie auf die PCs verteilt.
        Eine Anleitung liegt der App bei.

      Welche Daten die Software an den Hersteller sendet, steht in der
      [Datenschutzerklärung](https://room-control.de/datenschutz.html#software).
