id: COMMUNITY-opendesk-nextcloud
description:
  en-US:
    name: Nextcloud in openDesk
    short_description: File management via Nextcloud with Nubus SSO in the openDesk suite
    long_description: |-
      Nextcloud is the file management component of the openDesk digital
      workplace suite. It provides file sync and share, collaborative editing
      (via Collabora Online), and a wide range of productivity apps.

      As part of openDesk, Nextcloud is integrated with Univention Nubus for
      Single Sign-On via OIDC through the Keycloak identity provider included
      in Nubus. It uses the Nubus Directory Service to implement
      user and group lifecycle. The integration is based on the Packaged Integration
      provided by Univention.
    icon: 'logo.svg'
    keywords:
    - Nextcloud
    - File Sync
    - File Share
    - Cloud Storage
    - openDesk
    - Nubus
    links:
    - Description: openDesk on openCoDE
      URL: https://gitlab.opencode.de/bmi/opendesk/deployment/opendesk
    - Description: Nextcloud website
      URL: https://nextcloud.com/
    - Description: Packaged Integration for Nextcloud
      URL: https://docs.software-univention.de/packaged-integration-nextcloud/latest/en/index.html
    tags: []
    visuals: []
  de-DE:
    name: Nextcloud in openDesk
    short_description: Dateiverwaltung mit Nextcloud und Nubus-SSO in der openDesk-Suite
    long_description: |-
      Nextcloud ist die Dateiverwaltungskomponente der digitalen
      Arbeitsplatzlösung openDesk. Es bietet Dateisynchronisation und
      -freigabe, kollaboratives Bearbeiten (über Collabora Online) und eine
      Vielzahl von Produktivitäts-Apps.

      Als Teil von openDesk ist Nextcloud über OIDC mit Univention Nubus für
      Single Sign-On integriert, unter Verwendung des in Nubus enthaltenen
      Keycloak-Identity-Providers. Es greift auf den Nubus Directory
      Service zu um Nutzer und Gruppen abzugleichen. Die Anbindung basiert auf der
      von Univention bereitgestellten Paketierten Integration.
    icon: 'logo.svg'
    keywords:
    - Nextcloud
    - Dateisynchronisation
    - Dateifreigabe
    - Cloud-Speicher
    - openDesk
    - Nubus
    links:
    - Description: openDesk auf openCoDE
      URL: https://gitlab.opencode.de/bmi/opendesk/deployment/opendesk
    - Description: Nextcloud-Webseite
      URL: https://nextcloud.com/
    - Description: Paketierte Integration für Nextcloud
      URL: https://docs.software-univention.de/packaged-integration-nextcloud/latest/en/index.html
    tags: []
    visuals: []
