    tags: []
    visuals: []
  de-DE:
    name: BigBlueButton in openDesk Edu
    short_description: Virtuelles Klassenzimmer mit BigBlueButton und Nubus-SSO in openDesk Edu
    long_description: |-
      BigBlueButton ist ein virtuelles Klassenzimmer- und Webkonferenzsystem,
      das als Alternative zu Jitsi in das openDesk-Edu-Projekt integriert ist.
      Es bietet Vorlesungsaufzeichnung, interaktives Whiteboard,
      Breakout-Räume, gemeinsame Notizen und Umfragefunktionen für den
      Online-Unterricht.

      Als Teil von openDesk Edu ist BigBlueButton über SAML mit Univention
      Nubus für Single Sign-On integriert, unter Verwendung des in Nubus
      enthaltenen Keycloak-Identity-Providers.
    icon: ''
