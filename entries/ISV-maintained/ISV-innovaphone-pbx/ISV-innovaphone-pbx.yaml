description:
  en-US:
    name: innovaphone myApps Integration with UCS via LDAP and Keycloak SSO
    short_description: LDAP user provisioning and Single Sign-On for innovaphone myApps with Univention Corporate Server
    long_description: |
      TThis integration connects the innovaphone myApps platform and PBX telephony solution with 
      Univention Nubus through LDAP synchronization and Single Sign-On (SSO) via Keycloak.

      User accounts managed in Nubus are synchronized into the innovaphone
      environment through an LDAP replicator. Attributes such as username,
      display name, and phone number (extension) are mapped from the Nubus
      LDAP directory to the corresponding innovaphone user attributes,
      enabling automated provisioning of telephony users.

      In addition, Keycloak — included as the identity provider in
      Univention Nubus — is configured to provide SSO via OIDC.
      Users authenticate once through Keycloak and gain seamless access
      to the innovaphone platform and its telephony features.

      ## Features

      - Automated user provisioning from Nubus to innovaphone via LDAP replication
      - Mapping of LDAP attributes (username, phone number, display name)
      - Single Sign-On via Keycloak (OIDC)
      - Telephony services accessible through SSO

